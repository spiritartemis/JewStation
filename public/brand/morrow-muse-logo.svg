<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">Morrow &amp; Muse</title>
  <desc id="desc">A refined wordmark with a tiny four-point star and pearl mark, and the tagline Made for your becoming.</desc>
  <g fill="#262321" text-anchor="middle">
    <text x="360" y="105" font-family="Bodoni 72, Didot, 'Times New Roman', serif" font-size="64" letter-spacing="1">Morrow <tspan font-style="italic" font-size="48">&amp;</tspan> Muse</text>
    <text x="360" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4">MADE FOR YOUR BECOMING</text>
  </g>
  <g fill="#B68E64" transform="translate(360 32)">
    <path d="M0 -10 C2 -3 3 -2 10 0 C3 2 2 3 0 10 C-2 3 -3 2 -10 0 C-3 -2 -2 -3 0 -10Z"/>
    <circle cx="15" cy="-7" r="2.5" fill="#FFFFFF" stroke="#B68E64" stroke-width="1"/>
  </g>
</svg>
